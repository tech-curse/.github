name: Bug
description: Algo não funciona como deveria.
labels: ["bug"]
body:
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Acesse ...
        2. Clique em ...
        3. Veja o erro
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      description: Navegador, sistema operacional, ou staging/produção.
  - type: textarea
    id: evidencias
    attributes:
      label: Logs ou capturas de tela
      description: Remova tokens, senhas e dados pessoais antes de colar.
